services:
  - type: web
    name: debugroom-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: debugroom-db
          property: connectionString
      - key: REDIS_URL
        sync: false  # Set manually from Upstash

databases:
  - name: debugroom-db
    databaseName: debugroom
    user: debugroom
    plan: free
